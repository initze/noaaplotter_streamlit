[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noaaplotter_streamlit"
version = "0.2.0"
description = "This is a Streamlit app utilizing the noaaplotter package"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "streamlit>=1.40",
    # noaaplotter pinned to a released tag; bump the tag here when a new release is out
    "noaaplotter @ git+https://github.com/initze/noaaplotter.git@v0.6.3",
    "setuptools",
]
authors = [
    { name = "Ingmar Nitze", email = "ingmar.nitze@awi.de" }
    ]

[tool.setuptools.packages.find]
where = ["src"]
