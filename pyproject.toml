[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noaaplotter_streamlit"
version = "0.2.0"
description = "This is a Streamlit app utilizing the noaaplotter package"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "streamlit>=1.40",
    # modernized backend: polars core, plotly engine, NOAA + coordinate (Open-Meteo/CDS) sources.
    # switch back to @main once feat/modernization is merged
    "noaaplotter @ git+https://github.com/initze/noaaplotter.git@v0.6.1",
    "setuptools",
]
authors = [
    { name = "Ingmar Nitze", email = "ingmar.nitze@awi.de" }
    ]

[tool.setuptools.packages.find]
where = ["src"]
